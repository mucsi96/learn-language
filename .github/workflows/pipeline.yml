name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-build-server-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # The Spring profile is resolved during AOT processing and baked into the
      # native executable, so the e2e image is built with the test profile and
      # the published image (see publish-server) with the prod profile.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: server
          build-args: SPRING_PROFILE=test
          tags: localhost/learn-language-server:test
          outputs: type=docker,dest=/tmp/server-image.tar
          cache-from: type=gha,scope=server-test
          cache-to: type=gha,mode=max,scope=server-test
      - name: Upload server image
        uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: /tmp/server-image.tar
          retention-days: 1

  build-client-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-client-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          tags: localhost/learn-language-client:test
          outputs: type=docker,dest=/tmp/client-image.tar
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
      - name: Upload client image
        uses: actions/upload-artifact@v4
        with:
          name: client-image
          path: /tmp/client-image.tar
          retention-days: 1

  build-mock-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-build-mock-${{ matrix.name }}-image-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openai
            context: mock_openai_server
          - name: google-ai
            context: mock_google_ai_server
          - name: elevenlabs
            context: mock_elevenlabs_server
          - name: anthropic
            context: mock_anthropic_server
          - name: ideogram
            context: mock_ideogram_server
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build mock ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          tags: localhost/learn-language-mock-${{ matrix.name }}:test
          outputs: type=docker,dest=/tmp/mock-${{ matrix.name }}-image.tar
          cache-from: type=gha,scope=mock-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=mock-${{ matrix.name }}
      - name: Upload mock ${{ matrix.name }} image
        uses: actions/upload-artifact@v4
        with:
          name: mock-${{ matrix.name }}-image
          path: /tmp/mock-${{ matrix.name }}-image.tar
          retention-days: 1

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: test-e2e-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    needs: [build-server-image, build-client-image, build-mock-images]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: test/package-lock.json
      - name: Install dependencies
        working-directory: test
        run: npm ci
      - name: Install Playwright browsers
        working-directory: test
        run: npx playwright install chromium --with-deps
      # Only the image tarballs. Without the pattern this also pulls the
      # .dockerbuild build records docker/build-push-action uploads on its own,
      # which this job has no use for and which failed the whole step when one
      # of them would not download.
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: "*-image"
          path: /tmp
          merge-multiple: true
      - name: Load images into Podman
        run: |
          for image in /tmp/*-image.tar; do
            podman load -i "$image"
          done
      # The server is a single native executable, so if it cannot even start in
      # the runtime image there is nothing to log and the pod just times out two
      # minutes later with an empty container log. Fail here instead.
      - name: Check the server executable runs
        run: |
          timeout 60 podman run --rm localhost/learn-language-server:test \
            -XX:PrintFlags= > /dev/null
      - name: Setup test environment and start pod
        env:
          SKIP_BUILD: "1"
        run: scripts/pod_up.sh
      - name: Run Playwright tests
        working-directory: test
        run: npx playwright test --shard=${{ matrix.shard }}/5
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test/test-results
      - name: Collect pod logs
        if: always()
        run: |
          for container in $(podman pod inspect learn-language-test --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null); do
            echo "$container" | grep -q "infra" && continue
            echo "=== $container ==="
            podman logs "$container" 2>&1 || true
          done

      - name: Summarize failed tests
        if: failure()
        working-directory: test
        run: |
          for context in test-results/*/error-context.md; do
            [ -f "$context" ] || continue
            echo "=== $(dirname "$context") ==="
            head -40 "$context"
          done

  publish-server:
    concurrency:
      group: publish-server-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get next version
        id: get_next_version
        uses: mucsi96/get-next-version@main
        with:
          prefix: 'server'
          src: server
      - name: Set up Docker Buildx
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve server image tag
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        run: |
          echo "SERVER_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/learn-language-server:${{ steps.get_next_version.outputs.version }}" >> "$GITHUB_ENV"

      # Built, then checked, then pushed - not build-and-push - so a prod
      # executable that cannot start never reaches Docker Hub.
      - name: Build server image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          build-args: SPRING_PROFILE=prod
          tags: ${{ env.SERVER_IMAGE }}
          cache-from: type=gha,scope=server-prod
          cache-to: type=gha,mode=max,scope=server-prod

      # The profile is baked in at build time, so this is a different
      # executable from the one test-e2e exercised, taking code paths - the Key
      # Vault property source above all - that no test covers. This cannot
      # catch a missing reflection hint, but it does catch a binary that does
      # not start, before the image is published and deploy picks it up.
      - name: Check the server executable runs
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        run: |
          timeout 60 docker run --rm "$SERVER_IMAGE" -XX:PrintFlags= > /dev/null

      - name: Push server image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        run: docker push "$SERVER_IMAGE"

      # Tag the commit this image was actually built from. Without
      # target_commitish the release action tags whatever main points at when
      # the release is created, which is a different commit whenever another
      # push lands during the minutes the native build takes. The next run then
      # asks get-next-version for a version, sees the tag already on its own
      # HEAD, concludes nothing changed and publishes nothing - while deploy
      # still succeeds, on the previous commit's image.
      - name: Create release
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_next_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  publish-client:
    concurrency:
      group: publish-client-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get next version
        id: get_next_version
        uses: mucsi96/get-next-version@main
        with:
          prefix: 'client'
          src: client
      - name: Set up Docker Buildx
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push client image
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/learn-language-client:${{ steps.get_next_version.outputs.version }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
      # Tag the commit this image was built from, not whatever main points at
      # by the time the release is created - see publish-server above.
      - name: Create release
        if: steps.get_next_version.outputs.hasNextVersion == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_next_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
  deploy:
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [publish-server, publish-client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.2.7'

      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ secrets.TWINGATE_SERVICE_KEY }}

      - name: Deploy to Kubernetes
        env:
          AZURE_KEYVAULT_NAME: ${{ secrets.AZURE_KEYVAULT_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: scripts/deploy.sh
