<section
  class="drop-zone"
  [class.active]="dragActive()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <mat-icon class="drop-icon">upload_file</mat-icon>
  <h2>Drop a word list</h2>
  <p class="drop-hint">
    Drag the analyzer JSON here, or pick it from your device. Words you already
    know and words that already have a card are filtered out automatically.
  </p>

  <input
    #fileInput
    class="file-input"
    type="file"
    accept="application/json,.json"
    aria-label="Word list JSON file"
    (change)="onFileSelected($event)"
  />
  <button
    mat-flat-button
    type="button"
    [disabled]="busy()"
    (click)="fileInput.click()"
  >
    <mat-icon>folder_open</mat-icon>
    Choose JSON file
  </button>

  @if (fileName()) {
  <p class="file-name">{{ fileName() }}</p>
  } @if (busy()) {
  <mat-progress-bar mode="indeterminate" aria-label="Staging words" />
  } @if (error(); as message) {
  <p class="error" role="alert">{{ message }}</p>
  }
</section>
