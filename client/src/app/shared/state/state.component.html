@if (display() === 'dots') {
  @for (dot of dots(); track dot) {
    <span
      class="state-dot"
      [class.current]="current() && $first"
      [attr.aria-current]="current() && $first ? 'true' : null"
      [ngStyle]="stateStyle()"
      role="img"
      [attr.aria-label]="'State: ' + stateName()"
      [attr.title]="current() && $first ? 'Current card: ' + stateName() : stateName()"
    ></span>
  }
} @else if (count() !== undefined) {
<span [ngStyle]="stateStyle()" [attr.title]="stateName()" class="state-chip">
  {{ count() }}
</span>
} @else {
<span [ngStyle]="stateStyle()" [attr.aria-label]="'State: ' + stateName()" class="state-chip">
  {{ stateName() }}
</span>
}
