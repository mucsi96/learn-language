@if (studySession.pomodoroTime(); as time) {
  @if (studySession.restartControl(); as restart) {
    <button mat-button aria-label="Start new study session" matTooltip="Start new study session"
      [disabled]="restart.disabled()" (click)="restart.start()">
      <span role="timer" aria-label="Study Pomodoro" class="pomodoro"
        [class.expired]="studySession.pomodoroSeconds() === 0">
        {{ time }}
      </span>
    </button>
  }
  @if (studySession.pomodoroSeconds() === 0) {
    <span role="status" class="break-status">Time for a break!</span>
  }
}
<button class="avatar" aria-label="Profile menu" [matMenuTriggerFor]="menu">
  {{ profile()?.initials }}
</button>
<mat-menu #menu="matMenu">
  <span class="profile-name">
    {{ profile()?.name }}
  </span>
  <a mat-menu-item [routerLink]="['/sources']">Sources</a>
  <a mat-menu-item [routerLink]="['/in-review-cards']">Review cards</a>
  <a mat-menu-item [routerLink]="['/settings']">Settings</a>
  <a mat-menu-item [routerLink]="['/model-usage']">Model usage</a>
</mat-menu>
