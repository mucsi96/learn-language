<h2 mat-dialog-title>Extract Known Cards</h2>
<mat-dialog-content>
  <p class="dialog-description">
    Select the sources to export. The download contains every card word in
    normal form from the selected sources together with all known words.
  </p>
  <mat-form-field appearance="outline" class="source-select">
    <mat-label>Sources</mat-label>
    <mat-select multiple [formField]="sourceForm.sourceIds">
      @for (source of sources(); track source.id) {
      <mat-option [value]="source.id">{{ source.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button
    mat-flat-button
    (click)="onExport()"
    [disabled]="!canExport()"
    aria-label="Export"
  >
    Export
  </button>
</mat-dialog-actions>
