logger:
  enable: true
  level: info
  format: json
server:
  binding: 0.0.0.0
  port: <%= get_env(name="SERVER_PORT") %>
  host: http://localhost
  middlewares:
    etag:
      enable: false
    fallback:
      enable: false
workers:
  mode: BackgroundAsync
database:
  uri: ""
  enable_logging: false
  min_connections: 5
  max_connections: 20
  connect_timeout: 30000
  idle_timeout: 300000
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
  run_on_start: CREATE SCHEMA IF NOT EXISTS learn_language
