databaseChangeLog:
  - changeSet:
      id: 61-backfill-adjective-degrees
      author: mucsi96
      changes:
        - sql:
            sql: |
              CREATE TABLE learn_language.adjective_forms_backfill (
                card_id varchar(255) PRIMARY KEY REFERENCES learn_language.cards(id) ON DELETE CASCADE,
                next_attempt_at timestamptz NOT NULL DEFAULT now(),
                lease_token uuid,
                last_error text
              );
              INSERT INTO learn_language.adjective_forms_backfill (card_id)
              SELECT id FROM learn_language.cards
              WHERE type = 'VOCABULARY' AND data->>'type' = 'ADJECTIVE';
              UPDATE learn_language.content_items
              SET preparation = preparation - 'words', status = 'queued', error = NULL,
                  lease_token = NULL, lease_until = NULL
              WHERE status = 'prepared';
