http:
  routers:
    server:
      rule: "PathPrefix(`/api`)"
      priority: 10
      service: server
      entryPoints:
        - web
    client:
      rule: "PathPrefix(`/`)"
      priority: 1
      service: client
      middlewares:
        - spa-document
      entryPoints:
        - web
    assets:
      rule: 'PathRegexp(`\.[a-zA-Z0-9]+$`)'
      priority: 2
      service: client
      entryPoints:
        - web
  middlewares:
    spa-document:
      replacePath:
        path: /index.html
  services:
    server:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8074"
    client:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8000"
